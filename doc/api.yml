openapi: 3.0.3
info:
  title: HEI Graduates Management API
  description: |
    API for managing HEI graduates (PROG4/SYS3 - Final Exam).

    Covered business rules:
    - A course can be taught by several teachers (CourseTeacher).
    - A course is given by one or more teachers to several groups, but not
      always to all groups (CourseGroup).
    - A student can change group at any time during their path (StudentGroup
      with startDate/endDate history).
    - A student can see THEIR grades and THEIR transcripts.
    - A teacher can see and modify all the grades of their courses.
    - An admin can do everything, including seeing the results of the promotion
      over the 3 years.
    - A grade can change over time (claims, errors): one must always provide a
      reason (reason) and the full history is kept (GradeModification).

    Main features:
    - Sending a grade transcript as PDF by email with AWS S3 link (asynchronous).
    - Downloading (without email) an Excel file of the list of graduates of a
      given promotion.
    - Thymeleaf GUI listing all promotions with a download button.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://examfinal-b950b005.computes-lyon.hei.school
    description: Pre-production

tags:
  - name: Users
    description: User management (students, teachers, admins)
  - name: Groups
    description: Group management and student membership
  - name: Courses
    description: Course management, teachers and associated groups
  - name: Exams
    description: Exam management
  - name: Grades
    description: Grade management and their history
  - name: Transcripts
    description: Grade transcripts (PDF, email, S3)
  - name: Promotions
    description: Promotions, results and list of graduates
  - name: Ui
    description: Thymeleaf GUI

paths:
  /users:
    get:
      tags: [Users]
      operationId: getUsers
      summary: List all users
      description: |
        Authorized roles: ADMIN.
        Allows filtering by role and searching by email.
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Role'
          description: Filter by role
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 30
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      description: |
        Authorized roles: ADMIN. A student can only see themselves.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update a user
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: User deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /groups:
    get:
      tags: [Groups]
      operationId: getGroups
      summary: List all groups
      description: "Authorized roles: ADMIN, TEACHER."
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - name: promotionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filters the groups of a given promotion
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create a group
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

  /groups/{id}:
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Get a group
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Groups]
      operationId: updateGroup
      summary: Update a group
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete a group
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Group deleted

  /groups/{id}/students:
    get:
      tags: [Groups]
      operationId: getGroupStudents
      summary: Students currently in a group
      description: |
        Authorized roles: ADMIN, TEACHER, and the student member of the group.
        Only returns active members (endDate null).
      security:
        - bearerAuth: [ADMIN, TEACHER, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Students of the group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /students/{id}/groups:
    get:
      tags: [Groups]
      operationId: getStudentGroupsHistory
      summary: Group history of a student
      description: |
        Authorized roles: ADMIN, or the student themselves (THEIR groups).
        A student can change group at any time: each change of assignment
        creates a StudentGroup with startDate/endDate.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Assignment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentGroup'
    post:
      tags: [Groups]
      operationId: changeStudentGroup
      summary: Change the group of a student
      description: |
        Authorized roles: ADMIN.
        Closes the current assignment (endDate = today) and creates a new
        assignment from studentId to the given groupId.
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentGroupChangeRequest'
      responses:
        '201':
          description: New assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGroup'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses:
    get:
      tags: [Courses]
      operationId: getCourses
      summary: List all courses
      description: |
        Authorized roles: ADMIN, TEACHER, STUDENT.
        A teacher only sees their own courses; a student only sees the courses
        given to their groups.
      security:
        - bearerAuth: [ADMIN, TEACHER, STUDENT]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 30
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
    post:
      tags: [Courses]
      operationId: createCourse
      summary: Create a course
      description: "Authorized roles: TEACHER, ADMIN."
      security:
        - bearerAuth: [ADMIN, TEACHER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'

  /courses/{id}:
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Get a course
      security:
        - bearerAuth: [ADMIN, TEACHER, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Course found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Courses]
      operationId: updateCourse
      summary: Update a course
      description: "Authorized roles: TEACHER (of this course), ADMIN."
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
    delete:
      tags: [Courses]
      operationId: deleteCourse
      summary: Delete a course
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Course deleted

  /courses/{id}/teachers:
    get:
      tags: [Courses]
      operationId: getCourseTeachers
      summary: Teachers of a course
      description: |
        Authorized roles: ADMIN, TEACHER.
        A course can be taught by several teachers.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Teachers of the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [Courses]
      operationId: assignTeacherToCourse
      summary: Assign a teacher to a course
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherAssignmentRequest'
      responses:
        '201':
          description: Teacher assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseTeacher'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{id}/teachers/{teacherId}:
    delete:
      tags: [Courses]
      operationId: removeTeacherFromCourse
      summary: Remove a teacher from a course
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: teacherId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Teacher removed from the course
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{id}/groups:
    get:
      tags: [Courses]
      operationId: getCourseGroups
      summary: Groups following a course
      description: |
        Authorized roles: ADMIN, TEACHER.
        A course is given to several groups but not necessarily to all.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Groups following the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      tags: [Courses]
      operationId: assignGroupToCourse
      summary: Give a course to a group
      description: "Authorized roles: TEACHER (of this course), ADMIN."
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseGroupAssignmentRequest'
      responses:
        '201':
          description: Group associated with the course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGroup'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{id}/groups/{groupId}:
    delete:
      tags: [Courses]
      operationId: removeGroupFromCourse
      summary: Remove a group from a course
      description: "Authorized roles: TEACHER (of this course), ADMIN."
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Group removed from the course
        '404':
          $ref: '#/components/responses/NotFound'

  /exams:
    get:
      tags: [Exams]
      operationId: getExams
      summary: List all exams
      description: |
        Authorized roles: ADMIN, TEACHER.
        Filterable by course.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - name: courseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filters the exams of a course
      responses:
        '200':
          description: List of exams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exam'
    post:
      tags: [Exams]
      operationId: createExam
      summary: Create an exam
      description: "Authorized roles: TEACHER (of the course), ADMIN."
      security:
        - bearerAuth: [ADMIN, TEACHER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamCreateRequest'
      responses:
        '201':
          description: Exam created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '400':
          $ref: '#/components/responses/BadRequest'

  /exams/{id}:
    get:
      tags: [Exams]
      operationId: getExam
      summary: Get an exam
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Exam found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Exams]
      operationId: updateExam
      summary: Update an exam
      description: "Authorized roles: TEACHER (of the course), ADMIN."
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamCreateRequest'
      responses:
        '200':
          description: Exam updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
    delete:
      tags: [Exams]
      operationId: deleteExam
      summary: Delete an exam
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Exam deleted

  /students/{id}/grades:
    get:
      tags: [Grades]
      operationId: getStudentGrades
      summary: Grades of a student
      description: |
        Authorized roles: ADMIN, or the student themselves (THEIR grades).
        A student can only see their own grades.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Student's grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
        '403':
          $ref: '#/components/responses/Forbidden'

  /students/{id}/transcript:
    get:
      tags: [Transcripts]
      operationId: getStudentTranscript
      summary: Transcript of a student
      description: |
        Authorized roles: ADMIN, or the student themselves (THEIR transcripts).
        Returns the detailed transcript: grades per subject, averages and
        credits obtained.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: promotionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Transcript limited to a promotion (year)
      responses:
        '200':
          description: Student's transcript
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '403':
          $ref: '#/components/responses/Forbidden'

  /students/{id}/transcript/pdf:
    get:
      tags: [Transcripts]
      operationId: downloadTranscriptPdf
      summary: Download the grade transcript as PDF
      description: |
        Authorized roles: ADMIN, or the student themselves.
        Generates (if necessary) and returns the PDF of the grade transcript.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: PDF file of the grade transcript
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{id}/transcript/send-email:
    post:
      tags: [Transcripts]
      operationId: sendTranscriptByEmail
      summary: Send the grade transcript by email (asynchronous)
      description: |
        Authorized roles: ADMIN, or the student themselves.
        ASYNCHRONOUS processing: generates the PDF, stores it on AWS S3 then
        sends the email to the student containing the S3 link. Immediately
        returns 202 with the transcript identifier; the status can be consulted
        via GET /transcripts/{id}.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '202':
          description: Send request accepted, processing in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptRequestAccepted'
        '404':
          $ref: '#/components/responses/NotFound'

  /transcripts/{id}:
    get:
      tags: [Transcripts]
      operationId: getTranscript
      summary: Status and S3 link of a generated transcript
      description: |
        Authorized roles: ADMIN, or the concerned student.
        Returns the AWS S3 link of the PDF once the transcript is generated.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Transcript found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{id}/grades:
    get:
      tags: [Grades]
      operationId: getCourseGrades
      summary: Grades of a course
      description: |
        Authorized roles: TEACHER (of this course), ADMIN.
        A teacher can see all the grades of their courses.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: examId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filters the grades of a specific exam
      responses:
        '200':
          description: Course grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Grades]
      operationId: createGrade
      summary: Enter a grade for a student
      description: |
        Authorized roles: TEACHER (of the course of the exam), ADMIN.
        The initial grade is created without history.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeCreateRequest'
      responses:
        '201':
          description: Grade created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /grades/{id}:
    put:
      tags: [Grades]
      operationId: updateGrade
      summary: Modify a grade
      description: |
        Authorized roles: TEACHER (of the course of the exam), ADMIN.
        A grade can change over time (claims, errors): the `reason` field is
        MANDATORY and explains why the grade is modified.
        Each modification is recorded in the history (GradeModification).
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeUpdateRequest'
      responses:
        '200':
          description: Grade modified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '400':
          description: The reason is mandatory for any modification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /grades/{id}/history:
    get:
      tags: [Grades]
      operationId: getGradeHistory
      summary: Modification history of a grade
      description: |
        Authorized roles: ADMIN, TEACHER (of the course of the exam).
        Complete history: old value, new value, reason, author, date.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Grade history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradeModification'
        '404':
          $ref: '#/components/responses/NotFound'

  /promotions:
    get:
      tags: [Promotions]
      operationId: getPromotions
      summary: List all promotions
      description: "Authorized roles: ADMIN, TEACHER, STUDENT."
      security:
        - bearerAuth: [ADMIN, TEACHER, STUDENT]
      responses:
        '200':
          description: List of promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promotion'
    post:
      tags: [Promotions]
      operationId: createPromotion
      summary: Create a promotion
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionCreateRequest'
      responses:
        '201':
          description: Promotion created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'

  /promotions/{id}:
    get:
      tags: [Promotions]
      operationId: getPromotion
      summary: Get a promotion
      security:
        - bearerAuth: [ADMIN, TEACHER, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Promotion found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '404':
          $ref: '#/components/responses/NotFound'

  /promotions/{id}/results:
    get:
      tags: [Promotions]
      operationId: getPromotionResults
      summary: Results of a promotion over the 3 years
      description: |
        Authorized roles: ADMIN only.
        Global results of the promotion over the 3 years of the course:
        averages per year, success rate, best students, etc.
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Promotion results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResults'
        '403':
          $ref: '#/components/responses/Forbidden'

  /promotions/{id}/graduates:
    get:
      tags: [Promotions]
      operationId: getPromotionGraduates
      summary: List of graduates of a promotion
      description: |
        Authorized roles: ADMIN, TEACHER.
        List of students who validated the promotion (JSON).
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: List of graduates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraduatesResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /promotions/{id}/graduates.xlsx:
    get:
      tags: [Promotions]
      operationId: downloadGraduatesExcel
      summary: Download the list of graduates as Excel
      description: |
        Authorized roles: ADMIN, TEACHER.
        Generates and returns an Excel file (.xlsx) containing the list of
        graduates of the promotion, WITHOUT email.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Excel file of the list of graduates
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /ui/promotions:
    get:
      tags: [Ui]
      operationId: showPromotionsUi
      summary: Thymeleaf page listing all promotions
      description: |
        Thymeleaf GUI (simple page, without fancy CSS).
        Lists all promotions with, for each one, a button to download the list
        of graduates of the promotion.
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
      security: []

  /ui/promotions/{id}/graduates:
    get:
      tags: [Ui]
      operationId: downloadGraduatesExcelUi
      summary: Download button for the list of graduates (Thymeleaf)
      description: |
        Link used by the button of the Thymeleaf page. Redirects to the
        download of the Excel file of the graduates of the promotion.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Excel file of the list of graduates
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
      security: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token authentication. The token contains the role of the user
        (STUDENT, TEACHER or ADMIN) used to authorize each operation.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: UUID identifier
      schema:
        type: string
        format: uuid

  schemas:
    Role:
      type: string
      enum:
        - STUDENT
        - TEACHER
        - ADMIN

    User:
      type: object
      required:
        - id
        - ref
        - role
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    UserCreateRequest:
      type: object
      required:
        - ref
        - email
        - role
      properties:
        ref:
          type: string
          description: Unique user reference
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    UserUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    Course:
      type: object
      required:
        - id
        - ref
        - title
        - credits
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        title:
          type: string
        credits:
          type: integer
          format: int32
          description: Number of course credits
        promotionId:
          type: string
          format: uuid
          description: Promotion (year) the course belongs to

    CourseCreateRequest:
      type: object
      required:
        - ref
        - title
        - credits
      properties:
        ref:
          type: string
        title:
          type: string
        credits:
          type: integer
          format: int32
        promotionId:
          type: string
          format: uuid

    Group:
      type: object
      required:
        - id
        - ref
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        promotionId:
          type: string
          format: uuid
          description: Promotion the group belongs to

    GroupCreateRequest:
      type: object
      required:
        - ref
      properties:
        ref:
          type: string
        promotionId:
          type: string
          format: uuid

    StudentGroup:
      type: object
      required:
        - id
        - studentId
        - groupId
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          description: Start of the group assignment
        endDate:
          type: string
          format: date
          nullable: true
          description: End of the assignment (null if current assignment)

    StudentGroupChangeRequest:
      type: object
      required:
        - groupId
      properties:
        groupId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          description: "Start date of the new assignment (default: today)"

    CourseTeacher:
      type: object
      required:
        - id
        - courseId
        - teacherId
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid

    TeacherAssignmentRequest:
      type: object
      required:
        - teacherId
      properties:
        teacherId:
          type: string
          format: uuid

    CourseGroup:
      type: object
      required:
        - id
        - courseId
        - groupId
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid

    CourseGroupAssignmentRequest:
      type: object
      required:
        - groupId
      properties:
        groupId:
          type: string
          format: uuid

    Exam:
      type: object
      required:
        - id
        - courseId
        - dateExam
        - coefficient
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        ref:
          type: string
        dateExam:
          type: string
          format: date-time
          description: Exam date and time
        coefficient:
          type: number
          format: double
          description: Exam coefficient

    ExamCreateRequest:
      type: object
      required:
        - courseId
        - dateExam
        - coefficient
      properties:
        courseId:
          type: string
          format: uuid
        ref:
          type: string
        dateExam:
          type: string
          format: date-time
        coefficient:
          type: number
          format: double

    Grade:
      type: object
      required:
        - id
        - studentId
        - examId
        - value
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid
        value:
          type: number
          format: double
          description: Grade (between 0 and 20)
        comment:
          type: string
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          description: Date of the last modification
        modifiedBy:
          type: string
          format: uuid
          description: User who made the last modification

    GradeCreateRequest:
      type: object
      required:
        - studentId
        - examId
        - value
      properties:
        studentId:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid
        value:
          type: number
          format: double
        comment:
          type: string

    GradeUpdateRequest:
      type: object
      required:
        - value
        - reason
      properties:
        value:
          type: number
          format: double
          description: New grade value
        comment:
          type: string
        reason:
          type: string
          description: |
            MANDATORY reason of the modification (claim, input error, etc.)

    GradeModification:
      type: object
      required:
        - id
        - gradeId
        - oldValue
        - newValue
        - reason
      properties:
        id:
          type: string
          format: uuid
        gradeId:
          type: string
          format: uuid
        oldValue:
          type: number
          format: double
        newValue:
          type: number
          format: double
        reason:
          type: string
          description: Why the grade was modified
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string
          format: uuid

    Promotion:
      type: object
      required:
        - id
        - ref
        - year
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        year:
          type: integer
          format: int32
          description: Promotion year (e.g. 2026)

    PromotionCreateRequest:
      type: object
      required:
        - ref
        - year
      properties:
        ref:
          type: string
        year:
          type: integer
          format: int32

    Transcript:
      type: object
      required:
        - id
        - studentId
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        promotionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - GENERATED
            - EMAIL_SENT
            - FAILED
        pdfUrl:
          type: string
          nullable: true
          description: AWS S3 link of the generated PDF
        email:
          type: string
          format: email
          nullable: true
          description: Destination email address of the transcript
        generatedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptItem'

    TranscriptItem:
      type: object
      required:
        - courseTitle
        - examDate
        - coefficient
        - grade
      properties:
        courseTitle:
          type: string
        examDate:
          type: string
          format: date-time
        coefficient:
          type: number
          format: double
        grade:
          type: number
          format: double
          nullable: true
        credits:
          type: integer
          format: int32

    TranscriptRequestAccepted:
      type: object
      required:
        - transcriptId
        - status
      properties:
        transcriptId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
        message:
          type: string
          example: Processing in progress, the transcript will be sent by email.

    Graduate:
      type: object
      required:
        - studentId
        - firstName
        - lastName
        - email
        - average
      properties:
        studentId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        average:
          type: number
          format: double
          description: Overall average of the student
        creditsAcquired:
          type: integer
          format: int32
        graduated:
          type: boolean

    GraduatesResponse:
      type: object
      required:
        - promotionId
        - graduates
      properties:
        promotionId:
          type: string
          format: uuid
        promotionRef:
          type: string
        promotionYear:
          type: integer
          format: int32
        graduates:
          type: array
          items:
            $ref: '#/components/schemas/Graduate'

    PromotionResults:
      type: object
      required:
        - promotionId
        - promotionYear
      properties:
        promotionId:
          type: string
          format: uuid
        promotionYear:
          type: integer
          format: int32
        year1:
          $ref: '#/components/schemas/YearResults'
        year2:
          $ref: '#/components/schemas/YearResults'
        year3:
          $ref: '#/components/schemas/YearResults'
        overallAverage:
          type: number
          format: double
        graduationRate:
          type: number
          format: double
          description: Graduation rate (%)

    YearResults:
      type: object
      properties:
        year:
          type: integer
          format: int32
        average:
          type: number
          format: double
        bestStudentId:
          type: string
          format: uuid
        failureRate:
          type: number
          format: double

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Access denied (insufficient role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict (resource already exists)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
