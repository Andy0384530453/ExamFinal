openapi: 3.0.3
info:
  title: HEI Graduates Management API
  description: |
    API for managing HEI graduates (PROG4/SYS3 - Final Exam).

    Covered business rules:
    - A course can be taught by several teachers (CourseTeacher).
    - A course is given by one or more teachers to several groups, but not
      always to all groups (CourseGroup).
    - A student can change group at any time during their path (StudentGroup
      with startDate/endDate history).
    - A student can see THEIR grades and THEIR transcripts.
    - A teacher can see and modify all the grades of their courses.
    - An admin can do everything, including seeing the results of the promotion
      over the 3 years.
    - A grade can change over time (claims, errors): one must always provide a
      reason (reason) and the full history is kept (GradeModification).

    Main features:
    - Sending a grade transcript as PDF by email with AWS S3 link (asynchronous).
    - Downloading (without email) an Excel file of the list of graduates of a
      given promotion.
    - Thymeleaf GUI listing all promotions with a download button.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://examfinal-b950b005.computes-lyon.hei.school
    description: Pre-production

tags:
  - name: Courses
    description: Course teachers, groups and grades
  - name: Grades
    description: Grade management and their history
  - name: Transcripts
    description: Grade transcripts (PDF, email, S3)
  - name: Promotions
    description: Promotions, results, graduates and Thymeleaf GUI
  - name: StudentGroups
    description: Student group assignments and history

paths:
  /students/{id}/groups:
    get:
      tags: [StudentGroups]
      operationId: getStudentGroupsHistory
      summary: Group history of a student
      description: |
        Authorized roles: ADMIN, or the student themselves (THEIR groups).
        A student can change group at any time: each change of assignment
        creates a StudentGroup with startDate/endDate.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Assignment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentGroup'
    post:
      tags: [StudentGroups]
      operationId: changeStudentGroup
      summary: Change the group of a student
      description: |
        Authorized roles: ADMIN.
        Closes the current assignment (endDate = today) and creates a new
        assignment from studentId to the given groupId.
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentGroupChangeRequest'
      responses:
        '201':
          description: New assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGroup'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{courseId}/teachers:
    get:
      tags: [Courses]
      operationId: getCourseTeachers
      summary: Teachers of a course
      description: |
        Authorized roles: ADMIN, TEACHER.
        A course can be taught by several teachers.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Teachers of the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseTeacherResponse'
    post:
      tags: [Courses]
      operationId: assignTeacherToCourse
      summary: Assign a teacher to a course
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseTeacherAssignRequest'
      responses:
        '201':
          description: Teacher assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseTeacherResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{courseId}/teachers/{teacherId}:
    delete:
      tags: [Courses]
      operationId: removeTeacherFromCourse
      summary: Remove a teacher from a course
      description: "Authorized roles: ADMIN."
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: teacherId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Teacher removed from the course
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{courseId}/groups:
    get:
      tags: [Courses]
      operationId: getCourseGroups
      summary: Groups following a course
      description: |
        Authorized roles: ADMIN, TEACHER.
        A course is given to several groups but not necessarily to all.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Groups following the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseGroupResponse'
    post:
      tags: [Courses]
      operationId: assignGroupToCourse
      summary: Give a course to a group
      description: "Authorized roles: TEACHER (of this course), ADMIN."
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseGroupAssignmentRequest'
      responses:
        '201':
          description: Group associated with the course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGroupResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{courseId}/groups/{groupId}:
    delete:
      tags: [Courses]
      operationId: removeGroupFromCourse
      summary: Remove a group from a course
      description: "Authorized roles: TEACHER (of this course), ADMIN."
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Group removed from the course
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{id}/grades:
    get:
      tags: [Grades]
      operationId: getStudentGrades
      summary: Grades of a student
      description: |
        Authorized roles: ADMIN, or the student themselves (THEIR grades).
        A student can only see their own grades.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Student's grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
        '403':
          $ref: '#/components/responses/Forbidden'

  /courses/{courseId}/grades:
    get:
      tags: [Grades]
      operationId: getCourseGrades
      summary: Grades of a course
      description: |
        Authorized roles: TEACHER (of this course), ADMIN.
        A teacher can see all the grades of their courses.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Course grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Grades]
      operationId: createGrade
      summary: Enter a grade for a student
      description: |
        Authorized roles: TEACHER (of the course of the exam), ADMIN.
        The initial grade is created without history.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeCreateRequest'
      responses:
        '201':
          description: Grade created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /grades/{id}:
    put:
      tags: [Grades]
      operationId: updateGrade
      summary: Modify a grade
      description: |
        Authorized roles: TEACHER (of the course of the exam), ADMIN.
        A grade can change over time (claims, errors): the `reason` field is
        MANDATORY and explains why the grade is modified.
        Each modification is recorded in the history (GradeModification).
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeUpdateRequest'
      responses:
        '200':
          description: Grade modified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '400':
          description: The reason is mandatory for any modification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /grades/{id}/history:
    get:
      tags: [Grades]
      operationId: getGradeHistory
      summary: Modification history of a grade
      description: |
        Authorized roles: ADMIN, TEACHER (of the course of the exam).
        Complete history: old value, new value, reason, author, date.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Grade history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradeModification'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{id}/transcript:
    get:
      tags: [Transcripts]
      operationId: getStudentTranscript
      summary: Transcript of a student
      description: |
        Authorized roles: ADMIN, or the student themselves (THEIR transcripts).
        Returns the detailed transcript: grades per subject, averages and
        credits obtained.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: promotionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Transcript limited to a promotion (year)
      responses:
        '200':
          description: Student's transcript
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '403':
          $ref: '#/components/responses/Forbidden'

  /students/{id}/transcript/pdf:
    get:
      tags: [Transcripts]
      operationId: downloadTranscriptPdf
      summary: Download the grade transcript as PDF
      description: |
        Authorized roles: ADMIN, or the student themselves.
        Generates (if necessary) and returns the PDF of the grade transcript.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: PDF file of the grade transcript
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{id}/transcript/send-email:
    post:
      tags: [Transcripts]
      operationId: sendTranscriptByEmail
      summary: Send the grade transcript by email (asynchronous)
      description: |
        Authorized roles: ADMIN, or the student themselves.
        ASYNCHRONOUS processing: generates the PDF, stores it on AWS S3 then
        sends the email to the student containing the S3 link. Immediately
        returns 202 with the transcript identifier; the status can be consulted
        via GET /transcripts/{id}.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '202':
          description: Send request accepted, processing in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptRequestAccepted'
        '404':
          $ref: '#/components/responses/NotFound'

  /transcripts/{id}:
    get:
      tags: [Transcripts]
      operationId: getTranscript
      summary: Status and S3 link of a generated transcript
      description: |
        Authorized roles: ADMIN, or the concerned student.
        Returns the AWS S3 link of the PDF once the transcript is generated.
      security:
        - bearerAuth: [ADMIN, STUDENT]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Transcript found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '404':
          $ref: '#/components/responses/NotFound'

  /promotions:
    get:
      tags: [Promotions]
      operationId: getPromotions
      summary: List all promotions (Thymeleaf HTML page)
      description: |
        Returns a Thymeleaf HTML page listing all promotions with a download
        button for each promotion's graduates.
        Not a REST endpoint returning JSON.
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
      security: []

  /promotions/{id}/results:
    get:
      tags: [Promotions]
      operationId: getPromotionResults
      summary: Results of a promotion over the 3 years
      description: |
        Authorized roles: ADMIN only.
        Global results of the promotion over the 3 years of the course:
        averages per year, success rate, best students, etc.
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Promotion results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResults'
        '403':
          $ref: '#/components/responses/Forbidden'

  /promotions/{id}/graduates:
    get:
      tags: [Promotions]
      operationId: getPromotionGraduates
      summary: List of graduates of a promotion
      description: |
        Authorized roles: ADMIN, TEACHER.
        List of students who validated the promotion (JSON).
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: List of graduates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraduatesResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /promotions/{id}/graduates.xlsx:
    get:
      tags: [Promotions]
      operationId: downloadGraduatesExcel
      summary: Download the list of graduates as Excel
      description: |
        Authorized roles: ADMIN, TEACHER.
        Generates and returns an Excel file (.xlsx) containing the list of
        graduates of the promotion, WITHOUT email.
      security:
        - bearerAuth: [ADMIN, TEACHER]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Excel file of the list of graduates
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token authentication. The token contains the role of the user
        (STUDENT, TEACHER or ADMIN) used to authorize each operation.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: UUID identifier
      schema:
        type: string
        format: uuid

  schemas:
    StudentGroup:
      type: object
      required:
        - id
        - studentId
        - groupId
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date-time
          description: Start of the group assignment
        endDate:
          type: string
          format: date-time
          nullable: true
          description: End of the assignment (null if current assignment)

    StudentGroupChangeRequest:
      type: object
      required:
        - groupId
      properties:
        groupId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          description: "Start date of the new assignment (default: today)"

    CourseTeacherResponse:
      type: object
      required:
        - id
        - courseId
        - teacherId
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid

    CourseTeacherAssignRequest:
      type: object
      required:
        - teacherId
      properties:
        teacherId:
          type: string
          format: uuid

    CourseGroupResponse:
      type: object
      required:
        - id
        - courseId
        - groupId
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid

    CourseGroupAssignmentRequest:
      type: object
      required:
        - groupId
      properties:
        groupId:
          type: string
          format: uuid

    Grade:
      type: object
      required:
        - id
        - studentId
        - examId
        - value
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid
        examRef:
          type: string
          description: Reference of the exam
        courseTitle:
          type: string
          description: Title of the course
        value:
          type: number
          format: double
          description: Grade (between 0 and 20)
        comment:
          type: string
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          description: Date of the last modification
        modifiedBy:
          type: string
          format: uuid
          description: User who made the last modification

    GradeCreateRequest:
      type: object
      required:
        - studentId
        - examId
        - value
      properties:
        studentId:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid
        value:
          type: number
          format: double
        comment:
          type: string

    GradeUpdateRequest:
      type: object
      required:
        - value
        - reason
      properties:
        value:
          type: number
          format: double
          minimum: 0.0
          maximum: 20.0
          description: New grade value
        reason:
          type: string
          description: |
            MANDATORY reason of the modification (claim, input error, etc.)

    GradeModification:
      type: object
      required:
        - oldValue
        - newValue
        - reason
      properties:
        oldValue:
          type: number
          format: double
        newValue:
          type: number
          format: double
        reason:
          type: string
          description: Why the grade was modified
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string
          format: uuid

    PromotionResults:
      type: object
      required:
        - promotionId
        - promotionYear
      properties:
        promotionId:
          type: string
          format: uuid
        promotionYear:
          type: integer
          format: int32
        year1:
          $ref: '#/components/schemas/YearResults'
        year2:
          $ref: '#/components/schemas/YearResults'
        year3:
          $ref: '#/components/schemas/YearResults'
        overallAverage:
          type: number
          format: double
        graduationRate:
          type: number
          format: double
          description: Graduation rate (%)

    YearResults:
      type: object
      properties:
        year:
          type: integer
          format: int32
        average:
          type: number
          format: double
        bestStudentId:
          type: string
          format: uuid
        failureRate:
          type: number
          format: double

    Transcript:
      type: object
      required:
        - id
        - studentId
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        promotionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - GENERATED
            - EMAIL_SENT
            - FAILED
        pdfUrl:
          type: string
          nullable: true
          description: AWS S3 link of the generated PDF
        email:
          type: string
          format: email
          nullable: true
          description: Destination email address of the transcript
        generatedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptItem'

    TranscriptItem:
      type: object
      required:
        - courseTitle
        - examDate
        - coefficient
        - grade
      properties:
        courseTitle:
          type: string
        examDate:
          type: string
          format: date-time
        coefficient:
          type: number
          format: double
        grade:
          type: number
          format: double
          nullable: true
        credits:
          type: integer
          format: int32

    TranscriptRequestAccepted:
      type: object
      required:
        - transcriptId
        - status
      properties:
        transcriptId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
        message:
          type: string
          example: Processing in progress, the transcript will be sent by email.

    Graduate:
      type: object
      required:
        - studentId
        - firstName
        - lastName
        - email
        - average
      properties:
        studentId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        average:
          type: number
          format: double
          description: Overall average of the student

    GraduatesResponse:
      type: object
      required:
        - promotionId
        - graduates
      properties:
        promotionId:
          type: string
          format: uuid
        promotionRef:
          type: string
        promotionYear:
          type: integer
          format: int32
        graduates:
          type: array
          items:
            $ref: '#/components/schemas/Graduate'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Access denied (insufficient role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict (resource already exists)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
